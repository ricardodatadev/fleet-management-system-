# Dev somente: portas em 127.0.0.1. Carregado automaticamente pelo `docker compose`.
# Para a configuração base/produção: docker compose -f docker-compose.yml ...
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  python:
    ports:
      - "127.0.0.1:8000:8000"
  node:
    ports:
      - "127.0.0.1:${NODE_PORT:-3000}:${NODE_PORT:-3000}"
