# Roteamento conforme spec Fase 1 (seção B).
# Upstreams resolvidos em tempo de requisição (resolver do Docker) para não quebrar
# o nginx enquanto o serviço `node` (F1-05) ainda não existe.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança (repetidos nos locations que definem add_header próprio).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Health do próprio nginx
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        return 200 "ok\n";
    }

    # API Laravel (PHP-FPM). Só public/index.php é executado.
    location /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Socket.io (serviço node — F1-05). Preparado; responde 502 até o serviço existir.
    location /socket.io/ {
        set $node_upstream http://node:3000;
        proxy_pass $node_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA estática
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 443/TLS: terminado na borda em produção. Exemplo (desativado):
    # listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
}
