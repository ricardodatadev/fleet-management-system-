# Dev somente: portas em 127.0.0.1. Carregado automaticamente pelo `docker compose`.
# Para a configuração base/produção: docker compose -f docker-compose.yml ...
x-laravel-dev: &laravel-dev
  # Código via bind mount; vendor vem da imagem (volume nomeado, preserva o vendor da imagem).
  # Roda com o uid do host para escrever em storage/ e bootstrap/cache do bind mount
  # (exporte HOST_UID=$(id -u) HOST_GID=$(id -g) ou use o default 1000).
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./backend:/var/www/html
    - app_vendor:/var/www/html/vendor
    - ./docker/laravel/php-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro
    # docs/ do repositório (composer openapi grava docs/api/openapi.json aqui)
    - ./docs:/var/www/docs

services:
  app:
    <<: *laravel-dev
  worker:
    <<: *laravel-dev
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Banco de testes (sigof_test) só em dev; nunca em produção. Volume existente: `make test-db`.
      - ./docker/postgres/create-test-db.sh:/docker-entrypoint-initdb.d/02-create-test-db.sh:ro
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  python:
    ports:
      - "127.0.0.1:8000:8000"
  node:
    ports:
      - "127.0.0.1:${NODE_PORT:-3000}:${NODE_PORT:-3000}"
  # Vite com HMR (http://localhost:${FRONTEND_PORT:-5173}); /api é proxied para o nginx.
  frontend:
    image: node:24.21.0-alpine
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: sh -c "npm ci && npm run dev"
    environment:
      HOME: /tmp
      VITE_API_PROXY_TARGET: http://nginx
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks:
      - sigof
    depends_on:
      - nginx

volumes:
  # Atenção: após mudar composer.json/composer.lock, rebuild + `docker compose down` e
  # `docker volume rm sigof_app_vendor` para o vendor novo da imagem substituir o antigo.
  app_vendor:
