# Roteamento conforme spec Fase 1 (seção B).
# Upstreams resolvidos em tempo de requisição (resolver do Docker) para não quebrar
# o nginx enquanto o serviço `node` (F1-05) ainda não existe.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança (repetidos nos locations que definem add_header próprio).
    # Socket.io na mesma origem: pelo CSP3, 'self' (herdado por connect-src) cobre ws:// e wss:// do
    # próprio host (Chrome, Firefox e Safari 15.4+). Não listamos o host explicitamente para não refletir
    # o cabeçalho Host (controlado pelo cliente) no CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Health do próprio nginx
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        return 200 "ok\n";
    }

    # Swagger UI (location e CSP própria somente com L5_SWAGGER_ENABLED=true; senão /api/documentation cai em /api/ → 404 do Laravel)
    include /etc/nginx/enabled/*.conf;

    # API Laravel (PHP-FPM). Só public/index.php é executado.
    location /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Socket.io (serviço node). Upgrade para WebSocket; o handshake é autenticado no node (F1-18:
    # token → Laravel /auth/me). Conexão ociosa cai após 1 h (o cliente do socket.io reconecta);
    # o heartbeat do socket.io (25 s) mantém as conexões ativas abertas.
    location /socket.io/ {
        set $node_upstream http://node:3000;
        proxy_pass $node_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SPA estática
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 443/TLS: terminado na borda em produção. Exemplo (desativado):
    # listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
}
